<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Value Calculator</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    flex-direction: column;
    padding: 20px;
}

.container {
    background: rgba(30, 41, 59, 0.9);
    padding: 25px;
    border-radius: 16px;
    width: 430px;
    max-width: 100%;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

h1 {
    text-align: center;
    font-size: 24px;
    margin-bottom: 10px;
}

.dice-input {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
}

.dice-input img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    padding: 4px;
}

.input-group {
    flex: 1;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #cbd5f5;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #0f172a;
    color: white;
    outline: none;
    box-sizing: border-box;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.results-page {
    display: none;
    width: 760px;
    max-width: 100%;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 220px;
}

.amount {
    font-size: 28px;
    font-weight: 900;
}

.card img {
    width: 140px;
    height: 140px;
    object-fit: contain;
}

.total-cost {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 30px;
    font-size: 32px;
    font-weight: 900;
    color: #facc15;
}

.coin-icon {
    width: 52px;
    height: 52px;
    object-fit: contain;
}

.back-btn {
    width: 250px;
    display: block;
    margin: 25px auto 0;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    margin-top: 40px;
    font-size: 12px;
    color: #64748b;
    text-align: center;
}
</style>
</head>

<body>

<div class="container" id="inputPage">

    <h1>Dice Value Calculator</h1>

    <div class="dice-input">
        <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/normaldice.png">
        <div class="input-group">
            <label>Normal Dice</label>
            <input type="number" id="normalDice" min="0" value="0">
        </div>
    </div>

    <div class="dice-input">
        <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/golddice.png">
        <div class="input-group">
            <label>Gold Dice</label>
            <input type="number" id="goldDice" min="0" value="0">
        </div>
    </div>

    <div class="dice-input">
        <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/md1dice.png">
        <div class="input-group">
            <label>Mega Dice I</label>
            <input type="number" id="megaOneDice" min="0" value="0">
        </div>
    </div>

    <div class="dice-input">
        <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/md2dice.png">
        <div class="input-group">
            <label>Mega Dice II</label>
            <input type="number" id="megaTwoDice" min="0" value="0">
        </div>
    </div>

    <button onclick="calculateDice()">Calculate</button>

</div>

<div class="results-page" id="resultsPage">

    <div class="cards">

        <div class="card">
            <div class="amount" id="normalResult">x0</div>
            <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/normaldice.png">
        </div>

        <div class="card">
            <div class="amount" id="goldResult">x0</div>
            <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/golddice.png">
        </div>

        <div class="card">
            <div class="amount" id="megaOneResult">x0</div>
            <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/md1dice.png">
        </div>

        <div class="card">
            <div class="amount" id="megaTwoResult">x0</div>
            <img src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/md2dice.png">
        </div>

    </div>

    <div class="total-cost">
        <img class="coin-icon" src="https://raw.githubusercontent.com/ev1nced/ps99.fun/refs/heads/main/img/coin.png">
        <span id="totalCost">0</span>
    </div>

    <button class="back-btn" onclick="goBack()">Edit Values</button>

</div>

<div class="footer">made by evinced</div>

<script>

const NORMAL_PER_GOLD = 5;
const GOLD_PER_MEGA_ONE = 30;
const MEGA_ONE_PER_MEGA_TWO = 3;

const COST_NORMAL_TO_GOLD = 100;
const COST_GOLD_TO_MEGA_ONE = 100000;
const COST_MEGA_ONE_TO_MEGA_TWO = 300000;

const NORMAL_PER_MEGA_ONE = NORMAL_PER_GOLD * GOLD_PER_MEGA_ONE;
const NORMAL_PER_MEGA_TWO = NORMAL_PER_MEGA_ONE * MEGA_ONE_PER_MEGA_TWO;

function getValue(id) {
    return Math.floor(parseFloat(document.getElementById(id).value) || 0);
}

function formatAmount(num) {
    return "x" + num.toLocaleString();
}

function calculateDice() {

    const normal = getValue('normalDice');
    const gold = getValue('goldDice');
    const megaOne = getValue('megaOneDice');
    const megaTwo = getValue('megaTwoDice');

    let totalNormal =
        normal +
        (gold * NORMAL_PER_GOLD) +
        (megaOne * NORMAL_PER_MEGA_ONE) +
        (megaTwo * NORMAL_PER_MEGA_TWO);

    const upgradedMegaTwo = Math.floor(totalNormal / NORMAL_PER_MEGA_TWO);
    totalNormal %= NORMAL_PER_MEGA_TWO;

    const upgradedMegaOne = Math.floor(totalNormal / NORMAL_PER_MEGA_ONE);
    totalNormal %= NORMAL_PER_MEGA_ONE;

    const upgradedGold = Math.floor(totalNormal / NORMAL_PER_GOLD);
    totalNormal %= NORMAL_PER_GOLD;

    const upgradedNormal = totalNormal;

    const craftedGold = Math.floor(normal / NORMAL_PER_GOLD);

    const totalGoldAvailable = gold + craftedGold;

    const craftedMegaOne = Math.floor(totalGoldAvailable / GOLD_PER_MEGA_ONE);

    const totalMegaOneAvailable = megaOne + craftedMegaOne;

    const craftedMegaTwo = Math.floor(totalMegaOneAvailable / MEGA_ONE_PER_MEGA_TWO);

    const totalCost =
        (craftedGold * COST_NORMAL_TO_GOLD) +
        (craftedMegaOne * COST_GOLD_TO_MEGA_ONE) +
        (craftedMegaTwo * COST_MEGA_ONE_TO_MEGA_TWO);

    document.getElementById('normalResult').innerText = formatAmount(upgradedNormal);
    document.getElementById('goldResult').innerText = formatAmount(upgradedGold);
    document.getElementById('megaOneResult').innerText = formatAmount(upgradedMegaOne);
    document.getElementById('megaTwoResult').innerText = formatAmount(upgradedMegaTwo);

    document.getElementById('totalCost').innerText = totalCost.toLocaleString();

    document.getElementById('inputPage').style.display = 'none';
    document.getElementById('resultsPage').style.display = 'block';
}

function goBack() {
    document.getElementById('resultsPage').style.display = 'none';
    document.getElementById('inputPage').style.display = 'block';
}

</script>

</body>
</html>
