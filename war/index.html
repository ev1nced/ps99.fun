<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clan War Calculator</title>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e3a8a);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        flex-direction: column;
        padding: 20px;
    }

    .container {
        background: rgba(30, 41, 59, 0.9);
        padding: 25px;
        border-radius: 16px;
        width: 380px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        border: 1px solid rgba(255,255,255,0.1);
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 10px;
    }

    p.subtitle {
        text-align: center;
        font-size: 13px;
        color: #94a3b8;
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #cbd5f5;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        margin-top: 6px;
        background: #0f172a;
        color: white;
        outline: none;
        transition: 0.2s;
        box-sizing: border-box;
    }

    input:focus {
        box-shadow: 0 0 0 2px #3b82f6;
    }

    button {
        width: 100%;
        margin-top: 15px;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        cursor: pointer;
        font-weight: bold;
        letter-spacing: 0.5px;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(59,130,246,0.4);
    }

    button:active {
        transform: scale(0.97);
    }

    .result {
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
        background: rgba(15, 23, 42, 0.8);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.08);
    }

    .divider {
        margin-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }

    .footer {
        margin-top: 40px;
        text-align: center;
        font-size: 12px;
        color: #64748b;
        animation: fadeIn 1s ease 0.5s both;
    }
</style>

</head>
<body>

<div class="container">
    <h1>Clan War Calculator</h1>
    <p class="subtitle">Pet Simulator Chest Optimizer</p>

    <label>Points per Hour:</label>
    <input type="number" id="pointsPerHour" placeholder="e.g. 120">
    <button onclick="calcBreakTime()">Calculate Break Time</button>
    <div class="result" id="breakTimeResult"></div>

    <div class="divider"></div>

    <label>Time to Break Chest (seconds):</label>
    <input type="number" id="breakTime" placeholder="e.g. 12">
    <button onclick="calcPoints()">Calculate Points/Hour</button>
    <div class="result" id="pointsResult"></div>
</div>

<div class="footer">made by evinced</div>

<script>
    const RESPAWN_TIME = 30;

    function calcBreakTime() {
        const pph = parseFloat(document.getElementById('pointsPerHour').value);
        if (!pph || pph <= 0) {
            document.getElementById('breakTimeResult').innerText = "Enter valid points/hour";
            return;
        }

        const totalCycleTime = 3600 / pph;
        const breakTime = totalCycleTime - RESPAWN_TIME;

        document.getElementById('breakTimeResult').innerText =
            "You must break each chest in " + breakTime.toFixed(2) + " seconds";
    }

    function calcPoints() {
        const breakTime = parseFloat(document.getElementById('breakTime').value);
        if (!breakTime || breakTime <= 0) {
            document.getElementById('pointsResult').innerText = "Enter valid break time";
            return;
        }

        const totalCycleTime = breakTime + RESPAWN_TIME;
        const cyclesPerHour = 3600 / totalCycleTime;

        document.getElementById('pointsResult').innerText =
            "You will make " + cyclesPerHour.toFixed(2) + " points per hour";
    }
</script>

</body>
</html>
