<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Simulator Clan War Chest Calculator</title>
    <style>
        body {
            background: linear-gradient(135deg, #f0f0f0, #c9c9c9);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: white;
        }
        h1 {
            text-align: center;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chest Calculator</h1>
        <label for="pointsPerHour">Points Per Hour:</label>
        <input type="number" id="pointsPerHour" placeholder="Enter points per hour">
        <label for="timeToBreak">Time to Break a Chest (seconds):</label>
        <input type="number" id="timeToBreak" placeholder="Enter time in seconds">
        <button onclick="calculate()">Calculate</button>
        <div id="result"></div>
    </div>
    <script>
        function calculate() {
            const pointsPerHourInput = document.getElementById('pointsPerHour').value;
            const timeToBreakInput = document.getElementById('timeToBreak').value;
            const resultDiv = document.getElementById('result');

            let result = '';

            if (pointsPerHourInput) {
                // Calculate time to break chest
                const pointsPerHour = parseFloat(pointsPerHourInput);
                const timeToBreak = (3600 / pointsPerHour) + 30; // Adding 30 seconds respawn time
                result = `Time to Break Chest: ${timeToBreak.toFixed(2)} seconds.`;
            } else if (timeToBreakInput) {
                // Calculate points per hour
                const timeToBreakInSeconds = parseFloat(timeToBreakInput);
                const pointsPerHour = (3600 / (timeToBreakInSeconds - 30)); // Subtract respawn time
                result = `Points Per Hour: ${pointsPerHour.toFixed(2)} points.`;
            }

            resultDiv.innerHTML = result || 'Please provide one of the inputs!';
        }
    </script>
</body>
</html>
